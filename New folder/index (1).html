<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Movie Collection</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎬 My Movie Collection</h1>

      <form id="movie-form">
        <input
          type="text"
          id="title"
          placeholder="Movie name (e.g. Titanic)"
          required
        />

        <input
          type="number"
          id="duration"
          placeholder="Duration in minutes (e.g. 194)"
          required
        />

        <input
          type="number"
          id="year"
          placeholder="Release year (e.g. 1997)"
          required
        />

        <button type="submit">Add Movie</button>
      </form>

      <p id="loading-text">Loading...</p>

      <ul id="movie-list"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
